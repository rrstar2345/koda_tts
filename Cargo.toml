[package]
name = "kan_tts_rs"
version = "0.1.0"
edition = "2021"
description = "Standalone VITS/MMS-TTS (facebook) Kannada language speech synthesis in pure Rust"

[[bin]]
name = "kan_tts"
path = "src/main.rs"

[lib]
name = "kan_tts_rs"
path = "src/lib.rs"

[dependencies]
candle-core = "0.8"
candle-nn = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3