[package]
name = "koda_tts"
version = "0.1.0"
edition = "2021"
description = "Standalone VITS/MMS-TTS (facebook) speech synthesis in pure Rust"

[[bin]]
name = "koda_tts"
path = "src/main.rs"

[lib]
name = "tts_rs"
path = "src/lib.rs"

[dependencies]
candle-core = "0.8"
candle-nn = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6.0.0"
ureq = "3.3.0"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }

[profile.release]
opt-level = 3
